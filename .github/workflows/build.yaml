name: Build Sandbox

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  sandbox:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            preset: linux-release
          - runner: windows-2022
            preset: win-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-polos
      - name: Build Linux Sandbox
        if: runner.os == 'Linux'
        run: |
          Scripts/Linux/build_sandbox.sh linux-release
          mkdir -p out/packages
          tar -C out/bin/linux-release -czf out/packages/sandbox-linux-release.tar.gz .
      - name: Build Windows Sandbox
        if: runner.os == 'Windows'
        run: |
          ./Scripts/Windows/build_sandbox.ps1 -Preset win-release
          New-Item -ItemType Directory -Path out/packages -Force | Out-Null
          Compress-Archive -Path out/bin/win-release/* -DestinationPath out/packages/sandbox-win-release.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-${{ matrix.preset }}
          path: out/packages/sandbox-${{ matrix.preset }}.*
          if-no-files-found: error
