name: Nightly dummy

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-default-branch
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PRIMARY_BRANCH: ${{ github.event.repository.default_branch }}
      CC: gcc-14
      CXX: g++-14
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 ninja-build pkg-config libvulkan-dev glslang-tools \
            xorg-dev libglu1-mesa-dev libwayland-dev libxkbcommon-dev wayland-protocols
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Set up pinned vcpkg
        run: |
          baseline=$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')
          git init "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch --depth 1 origin "$baseline"
          git -C "$VCPKG_ROOT" checkout --detach FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: nightly-${{ runner.os }}-gcc14-${{ hashFiles('vcpkg.json', '.github/workflows/nightly.yaml') }}
          restore-keys: nightly-${{ runner.os }}-gcc14-

      - name: Configure
        run: |
          cmake -S . -B out/nightly -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/out/package" \
            -DBUILD_EXAMPLES=ON -DBUILD_TESTS=ON

      - name: Build dummy and tests
        run: cmake --build out/nightly --parallel 2

      - name: Test
        run: ctest --test-dir out/nightly --output-on-failure

      - name: Install and package
        id: package
        run: |
          cmake --install out/nightly
          version=$(cat VERSION)
          tag="v${version}-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          archive="polos-${tag}-linux-x64.tar.gz"
          cp LICENSE out/package/
          printf 'Run ./dummy from this directory. Requires a Vulkan 1.3 capable driver and a desktop session.\n' > out/package/RUNNING.txt
          # Bundled shared objects must resolve after extracting anywhere.
          if ldd out/package/dummy | grep 'not found'; then
            exit 1
          fi
          tar -C out/package -czf "$archive" .
          sha256sum "$archive" > "${archive}.sha256"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'Nightly dummy build from %s at %s.\n' "$PRIMARY_BRANCH" "$(git rev-parse HEAD)" > nightly-notes.md
          echo 'Extract the Linux x64 archive and run ./dummy from its directory. Requires a Vulkan 1.3 driver and desktop session.' >> nightly-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: nightly-dummy-linux-x64
          path: |
            polos-*.tar.gz
            polos-*.sha256
            nightly-notes.md
          if-no-files-found: error

    outputs:
      tag: ${{ steps.package.outputs.tag }}
      commit: ${{ steps.package.outputs.commit }}

  release:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nightly-dummy-linux-x64
      - name: Publish tagged nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NIGHTLY_TAG: ${{ needs.build.outputs.tag }}
          NIGHTLY_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          gh release create "$NIGHTLY_TAG" polos-*.tar.gz polos-*.sha256 \
            --target "$NIGHTLY_COMMIT" \
            --title "Polos $NIGHTLY_TAG" \
            --notes-file nightly-notes.md --prerelease --latest=false
